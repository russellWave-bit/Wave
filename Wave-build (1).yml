name: Build Wave

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Get the files
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Look for the zip
        id: z
        run: |
          if ls *.zip >/dev/null 2>&1; then echo "found=yes" >> "$GITHUB_OUTPUT"; else echo "found=no" >> "$GITHUB_OUTPUT"; echo "No zip in the repo yet. Upload Wave.zip and this will build."; fi

      # The engine pack is made once and kept on the Releases page as "engines-v1".
      # Later builds see it's already there and skip this step, so they stay quick.
      - name: Engine pack (first build only)
        if: steps.z.outputs.found == 'yes'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view engines-v1 -R "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "The engine pack is already published. Skipping."
            exit 0
          fi
          R=https://github.com/k2-fsa/sherpa-onnx/releases/download
          mkdir -p pack/asr pack/kws pack/tts
          echo "== speech engine (Parakeet) =="
          curl -L --fail -o asr.tar.bz2 $R/asr-models/sherpa-onnx-nemo-parakeet-tdt-0.6b-v2-int8.tar.bz2
          tar xjf asr.tar.bz2
          P=sherpa-onnx-nemo-parakeet-tdt-0.6b-v2-int8
          cp $P/encoder.int8.onnx $P/decoder.int8.onnx $P/joiner.int8.onnx $P/tokens.txt pack/asr/
          echo "== wake word =="
          curl -L --fail -o kws.tar.bz2 $R/kws-models/sherpa-onnx-kws-zipformer-gigaspeech-3.3M-2024-01-01.tar.bz2
          tar xjf kws.tar.bz2
          K=sherpa-onnx-kws-zipformer-gigaspeech-3.3M-2024-01-01
          cp $K/*.int8.onnx $K/tokens.txt pack/kws/
          echo "== voice detector, voice-print, noise cleaner =="
          curl -L --fail -o pack/silero_vad.onnx $R/asr-models/silero_vad.onnx
          curl -L --fail -o pack/speaker.onnx $R/speaker-recongition-models/wespeaker_en_voxceleb_resnet34_LM.onnx
          curl -L --fail -o pack/gtcrn.onnx $R/speech-enhancement-models/gtcrn_simple.onnx
          echo "== voice (Kokoro) =="
          curl -L --fail -o tts.tar.bz2 $R/tts-models/kokoro-en-v0_19.tar.bz2
          tar xjf tts.tar.bz2
          T=kokoro-en-v0_19
          cp $T/model.onnx $T/voices.bin $T/tokens.txt pack/tts/
          curl -L --fail -o pack/tts/lexicon-en-us.txt $R/tts-models/lexicon-en-us.txt
          rm -rf asr.tar.bz2 kws.tar.bz2 tts.tar.bz2 $P $K $T
          du -sh pack
          (cd pack && zip -0 -r -q ../engines.zip .)
          split -b 190m -d -a 1 engines.zip engines.part
          rm engines.zip
          python3 - <<'PY'
          import glob, hashlib, json, os
          parts = []
          for f in sorted(glob.glob("engines.part*")):
              h = hashlib.sha256()
              with open(f, "rb") as fh:
                  for b in iter(lambda: fh.read(1 << 20), b""):
                      h.update(b)
              parts.append({"name": os.path.basename(f), "size": os.path.getsize(f), "sha256": h.hexdigest()})
          json.dump({"version": "1", "total": sum(p["size"] for p in parts), "parts": parts}, open("manifest.json", "w"), indent=1)
          print(json.dumps(parts, indent=1))
          PY
          gh release create engines-v1 -R "$GITHUB_REPOSITORY" --title "Wave engines v1" \
            --notes "Wave downloads these by itself the first time it opens. You don't need to download them yourself." \
            engines.part* manifest.json
          rm -rf pack engines.part* manifest.json

      - name: Set up Java 17
        if: steps.z.outputs.found == 'yes'
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Accept Android licences
        if: steps.z.outputs.found == 'yes'
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true

      - name: Set up Gradle
        if: steps.z.outputs.found == 'yes'
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.9

      - name: Build the app
        if: steps.z.outputs.found == 'yes'
        run: |
          # unpack oldest zip first, newest last, so the newest files always win
          rm -rf Wave
          for f in *.zip; do echo "$(git log -1 --format=%ct -- "$f") $f"; done | sort -n | while IFS= read -r line; do
            z="${line#* }"; echo "unpacking $z"; unzip -q -o "$z"
          done
          mkdir -p out
          if [ -f settings.gradle.kts ]; then d=.; else d=Wave; fi
          J="$d/app/src/main/jniLibs/arm64-v8a"
          mkdir -p "$J"
          echo "== engine library =="
          curl -L --fail -o lib.tar.bz2 https://github.com/k2-fsa/sherpa-onnx/releases/download/v2.0.1/sherpa-onnx-v2.0.1-android.tar.bz2
          tar xjf lib.tar.bz2 ./jniLibs/arm64-v8a
          cp jniLibs/arm64-v8a/*.so "$J/"
          rm -rf lib.tar.bz2 jniLibs
          (cd "$d" && gradle assembleDebug --no-daemon -PwaveRepo="$GITHUB_REPOSITORY" 2>&1 | tee ../build.log; st=${PIPESTATUS[0]}; echo "=== ERRORS ==="; grep -E "^e: |error:" ../build.log | head -80; echo "=== END ERRORS ==="; exit $st)
          cp "$d/app/build/outputs/apk/debug/app-debug.apk" out/Wave.apk
          ls -la out

      - name: Publish a release
        if: steps.z.outputs.found == 'yes'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Wave build ${{ github.run_number }}
          files: out/Wave.apk
